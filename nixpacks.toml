[phases.setup]
nixPkgs = ["python311Full", "nodejs_20", "wget"]

[phases.install]
cmds = [
  "wget -qO- https://bootstrap.pypa.io/get-pip.py | python3 - --break-system-packages && python3 -m pip install --break-system-packages -r backend/requirements.txt",
  "npm install",
  "npm run build"
]

[phases.build]
cmds = ["echo 'Build complete'"]

[start]
cmd = "cd backend && python3 -m uvicorn main:app --host 0.0.0.0 --port $PORT"
