[phases.setup]
nixPkgs = ["python311", "nodejs_20"]

[phases.install]
cmds = [
  "pip install --user -r backend/requirements.txt",
  "npm install",
  "npm run build"
]

[phases.build]
cmds = ["echo 'Build complete'"]

[start]
cmd = "cd backend && PYTHONPATH=/root/.local/lib/python3.11/site-packages python3 -m uvicorn main:app --host 0.0.0.0 --port $PORT"
