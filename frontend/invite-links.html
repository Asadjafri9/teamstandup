<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Invite Links — StandupBot</title>
  <link rel="icon" type="image/png" href="/logo.png">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div id="app" class="loading"><div class="loading-dot"></div></div>
  <script src="/app.js"></script>
  <script>
    const projectId = window.location.pathname.split('/').pop();
    requireAuth(function(user) {
      apiJSON('/api/projects/' + projectId).then(project => {
        const isLeader = project.current_member && project.current_member.role === 'Project Leader';
        if (!isLeader) { toast('Only leaders can manage invite links', true); redirect('/project/' + projectId); return; }
        loadLinks();
      });

      function loadLinks() {
        apiJSON('/api/projects/' + projectId + '/invite-links').then(links => {
          renderApp`
            <header class="nav-header"><a href="/dashboard" class="nav-logo"><img src="/logo.png"> StandupBot</a>
            <a href="/project/${projectId}" class="btn-ghost" style="font-size:.875rem;padding:.5rem 1rem;">Back</a></header>
            <main class="container-sm" style="padding-top:3rem;padding-bottom:3rem;">
              <a href="/project/${projectId}" style="font-size:.875rem;color:var(--ink-soft);">← Back to project</a>
              <h1 style="font-size:3rem;font-weight:700;color:var(--ink);margin-top:1rem;margin-bottom:2rem;">Invite links</h1>
              <div class="box box-shadow-hard" style="padding:1.5rem;margin-bottom:2rem;">
                <h3 style="font-size:1.125rem;color:var(--ink);margin-bottom:1rem;">Create new link</h3>
                <form id="link-form" style="display:flex;gap:.75rem;">
                  <select class="form-input" name="role" style="width:auto;">
                    <option value="Member">Member</option>
                    <option value="Project Leader">Leader</option>
                  </select>
                  <button type="submit" class="btn-primary">Generate link</button>
                </form>
              </div>
              <div class="box" style="padding:0;">
                ${links.length === 0 ? '<div style="padding:2rem;text-align:center;color:var(--ink-soft);">No invite links yet.</div>' : links.map(l => `
                  <div class="member-row">
                    <div><span class="pill" style="font-size:.65rem;">${escapeHtml(l.role)}</span><span style="margin-left:.75rem;font-family:monospace;font-size:.875rem;color:var(--ink);">/join/${l.invite_token}</span></div>
                    <button class="btn-ghost" style="font-size:.75rem;padding:.3rem .6rem;" onclick="copyLink('${l.invite_token}')">Copy</button>
                  </div>
                `).join('')}
              </div>
            </main>`;

          document.getElementById('link-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const fd = new FormData(e.target);
            const data = {};
            fd.forEach((v, k) => data[k] = v);
            apiJSON('/api/projects/' + projectId + '/invite-links', { method: 'POST', body: JSON.stringify(data) })
              .then(() => { toast('Link created!'); loadLinks(); })
              .catch(err => toast(err.message, true));
          });
        }).catch(err => toast(err.message, true));
      }
    });

    function copyLink(token) {
      const url = window.location.origin + '/join/' + token;
      navigator.clipboard.writeText(url).then(() => toast('Link copied!')).catch(() => toast('Copy failed', true));
    }
  </script>
</body>
</html>
